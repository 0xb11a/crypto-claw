# TODO P1: flip from advisory to enforcing — remove this comment AND remove
# continue-on-error: true in .github/workflows/pr.yml step 15 (the
# "Upload coverage to Codecov" step) AND remove if_no_uploads: pass below.
# All three must change together in the same PR as the first real
# libs/modules/* code that produces coverage uploads.

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error
        if_no_uploads: pass
    patch:
      default:
        target: 80%
  precision: 2
  round: down

comment:
  layout: 'reach,diff,flags,files,components'
