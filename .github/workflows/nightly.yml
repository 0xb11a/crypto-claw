name: Nightly CI

# Runs daily at 02:17 UTC and on manual workflow_dispatch.
# Four jobs:
#   audit               — pnpm audit --audit-level=high --prod (advisory)
#   trivy-info          — HIGH+CRITICAL scan of :v2 image, SARIF → Code Scanning (closes [OPEN-J])
#   container-smoke-nightly — pulls :v2, builds dist, runs boot-defense integration tests
#   e2e-full            — placeholder; full testcontainers E2E deferred to P1
#
# Permissions: contents:read (default), security-events:write (SARIF upload),
# packages:read (GHCR image pull). Per-job blocks override where needed.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

env:
  # Fund identifier (selects DB file; not a real deployment)
  SAFE_ID: ci-test

  # Infrastructure
  REDIS_URL: redis://localhost:6379

  # Bearer tokens — 32-char dummy values for CI (min-length 16 satisfied)
  RESEARCH_API_KEY: ci-research-key-aaaaaaaaaaaaaaaa
  SENTINEL_API_KEY: ci-sentinel-key-aaaaaaaaaaaaaaaa
  EXECUTOR_API_KEY: ci-executor-key-aaaaaaaaaaaaaaaa
  OBSERVER_API_KEY: ci-observer-key-aaaaaaaaaaaaaaaa
  LOOP_API_KEY: ci-loop-key-aaaaaaaaaaaaaaaaaaaaa
  WORKER_API_KEY: ci-worker-key-aaaaaaaaaaaaaaaaaaa
  SCHEDULER_API_KEY: ci-scheduler-key-aaaaaaaaaaaaaaa
  DASHBOARD_API_KEY: ci-dashboard-key-aaaaaaaaaaaaaaaa

  # Chains
  ACTIVE_CHAINS: base,solana

  # LLM (CI uses a dummy; real deployments use a real key or Codex OAuth)
  OPENAI_API_KEY: ci-openai-dummy-key-not-real-aaaaa

  # Node env
  NODE_ENV: test

  # Prisma: prevent auto-loading .env files (no .env in CI)
  PRISMA_DISABLE_DOTENV: '1'
  DATABASE_URL: file:./data/ci-test.db

  # P1c-i: executor stub mode
  EXECUTOR_STUB_MODE: '1'

jobs:
  # ---------------------------------------------------------------------------
  # audit — pnpm audit advisory (HIGH severity + prod deps only)
  # Advisory: continue-on-error:true; findings are informational until a
  # suppression policy review creates a tracking issue.
  # ---------------------------------------------------------------------------
  audit:
    name: pnpm audit (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit prod dependencies (advisory)
        run: pnpm audit --audit-level=high --prod
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # trivy-info — information-only HIGH+CRITICAL scan of :v2 image.
  # exit-code 0: never fails the pipeline. SARIF uploaded to Code Scanning.
  # No trivyignores: suppressions are irrelevant for an advisory scan.
  # See ADR-0017 for the CVE suppression policy.
  # Closes [OPEN-J].
  # ---------------------------------------------------------------------------
  trivy-info:
    name: Trivy info scan (HIGH+CRITICAL → Code Scanning)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout
        # Required so trivy can read repo metadata
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for HIGH+CRITICAL CVEs (informational)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:v2
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # container-smoke-nightly — pulls :v2, builds dist, runs Docker boot-defense
  # integration tests. Catches base-image drift that went undetected overnight.
  # ---------------------------------------------------------------------------
  container-smoke-nightly:
    name: Container smoke (nightly pull of :v2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull :v2 image
        run: docker pull ghcr.io/${{ github.repository }}:v2

      - name: Tag for local test consumption
        run: docker tag ghcr.io/${{ github.repository }}:v2 cclaw:nightly-smoke

      - name: Run boot-defense integration tests
        env:
          CCLAW_TEST_LOCAL_DOCKER_IMAGE: cclaw:nightly-smoke
        run: pnpm test:integration

  # ---------------------------------------------------------------------------
  # e2e-full — placeholder for full testcontainers E2E suite (deferred to P1).
  # When P1 lands: remove the echo, wire in pnpm test:e2e with Redis + SQLite
  # containers. The placeholder keeps the job green so branch protection can
  # require it without blocking P0c.
  # ---------------------------------------------------------------------------
  e2e-full:
    name: Full E2E (placeholder — deferred to P1)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: E2E placeholder
        run: echo '[deferred to P1] full testcontainers e2e — wire pnpm test:e2e here'
