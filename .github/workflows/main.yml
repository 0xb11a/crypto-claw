name: Main Pipeline

# Runs on push to v2 (during rewrite, P0b–P3) and main (post-cutover P4+).
# Produces a signed multi-arch OCI image at ghcr.io/<repo>:sha-<7>.
# Per ADR-0011 (v2 branch), ADR-0014 (GHCR registry), ADR-0015 (cosign keyless),
# ADR-0016 (trivy CRITICAL-only gate).

on:
  push:
    branches: [v2, main]
  workflow_dispatch:

# One concurrent run per ref; never cancel so every commit gets its sha- tag.
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

# Workflow-level permissions.
# packages:write — push to GHCR.
# id-token:write — GitHub Actions OIDC for cosign keyless signing.
# contents:read  — checkout.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  # Fund identifier (selects DB file; not a real deployment)
  SAFE_ID: ci-test

  # Infrastructure
  REDIS_URL: redis://localhost:6379

  # Bearer tokens — 32-char dummy values for CI (min-length 16 satisfied)
  RESEARCH_API_KEY: ci-research-key-aaaaaaaaaaaaaaaa
  SENTINEL_API_KEY: ci-sentinel-key-aaaaaaaaaaaaaaaa
  EXECUTOR_API_KEY: ci-executor-key-aaaaaaaaaaaaaaaa
  OBSERVER_API_KEY: ci-observer-key-aaaaaaaaaaaaaaaa
  LOOP_API_KEY: ci-loop-key-aaaaaaaaaaaaaaaaaaaaa
  WORKER_API_KEY: ci-worker-key-aaaaaaaaaaaaaaaaaaa
  SCHEDULER_API_KEY: ci-scheduler-key-aaaaaaaaaaaaaaa
  DASHBOARD_API_KEY: ci-dashboard-key-aaaaaaaaaaaaaaaa

  # Chains
  ACTIVE_CHAINS: base,solana

  # LLM (CI uses a dummy; real deployments use a real key or Codex OAuth)
  OPENAI_API_KEY: ci-openai-dummy-key-not-real-aaaaa

  # Node env
  NODE_ENV: test

jobs:
  # ---------------------------------------------------------------------------
  # 1. check — typecheck + lint + unit tests + schema/OpenAPI/SDK drift gates
  #    Mirrors pr.yml check job; sanity gate before publishing.
  # ---------------------------------------------------------------------------
  check:
    name: Typecheck + Lint + Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit --coverage

      - name: Schema drift gate
        run: echo '[deferred to P1] prisma migrate diff gate'

      - name: OpenAPI drift gate
        run: |
          pnpm run build:openapi
          git diff --exit-code sdk/generated/openapi.json

      - name: SDK drift gate
        run: |
          pnpm run build:sdk
          git diff --exit-code sdk/generated/

      - name: Secret scan (legacy pre-commit-check)
        run: node scripts/pre-commit-check.js || echo '[skip] pre-commit-check.js requires node scripts deps'

      - name: Secret scan (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ---------------------------------------------------------------------------
  # 2. integration — integration tests with Redis service container
  #    Mirrors pr.yml integration job.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: check

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Integration tests
        run: pnpm test:integration

  # ---------------------------------------------------------------------------
  # 3. build-and-publish — multi-arch OCI image build + GHCR push
  #    Pushes only on v2 / main branches; on workflow_dispatch from other refs
  #    the image is built but not pushed.
  # ---------------------------------------------------------------------------
  build-and-publish:
    name: Build + publish image
    runs-on: ubuntu-latest
    needs: integration
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch,enable=${{ github.ref_name == 'v2' || github.ref_name == 'main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: false
          cache-from: type=gha,scope=main
          cache-to: type=gha,scope=main,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

  # ---------------------------------------------------------------------------
  # 4. scan — trivy CRITICAL vulnerability gate (ADR-0016: CRITICAL-only for
  #    P0b–P5; tightens to HIGH+CRITICAL in P6 per ADR-0016)
  # ---------------------------------------------------------------------------
  scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for CRITICAL CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.build-and-publish.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

  # ---------------------------------------------------------------------------
  # 5. sbom — generate SPDX SBOM and attest via cosign
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate + attest SBOM
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        # Required by both syft (image pull below) and cosign (attest push at end).
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ needs.build-and-publish.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Attest SBOM (keyless OIDC — ADR-0015)
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            ghcr.io/${{ github.repository }}@${{ needs.build-and-publish.outputs.digest }}

  # ---------------------------------------------------------------------------
  # 6. sign — cosign keyless image signing (ADR-0015)
  # ---------------------------------------------------------------------------
  sign:
    name: Sign image (keyless)
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.ref == 'refs/heads/v2' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image (keyless OIDC)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ needs.build-and-publish.outputs.digest }}
