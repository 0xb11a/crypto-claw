services:
  crypto-claw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SAFE_ID: ${SAFE_ID:-default}
    container_name: crypto-claw
    restart: unless-stopped

    # Security hardening
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Writable directories:
    #   tmpfs  — ephemeral (repopulated by entrypoint.sh each start)
    #   volumes — persistent (survive restarts and redeploys)
    tmpfs:
      - /tmp:size=100M
      # Sentinel/executor workspaces are tmpfs (repopulated from templates each start)
      # exec required: better-sqlite3 native bindings need mmap from node_modules
      - /home/openclaw/.openclaw/agents/sentinel/workspace:size=50M,uid=1000,gid=1000,exec
      - /home/openclaw/.openclaw/agents/executor/workspace:size=50M,uid=1000,gid=1000,exec
      - /home/openclaw/.openclaw/agents/observer/workspace:size=50M,uid=1000,gid=1000,exec
      # Sentinel/executor/observer agent state dirs (sessions are ephemeral for these agents)
      - /home/openclaw/.openclaw/agents/sentinel/agent:size=10M,uid=1000,gid=1000
      - /home/openclaw/.openclaw/agents/executor/agent:size=10M,uid=1000,gid=1000
      - /home/openclaw/.openclaw/agents/observer/agent:size=10M,uid=1000,gid=1000
    volumes:
      # Persistent: research workspace (MEMORY.md, daily logs, skills, scripts, git)
      - crypto-claw-memory:/home/openclaw/.openclaw/agents/research/workspace
      # Persistent: wallet data (SQLite databases, one per SAFE_ID)
      - crypto-claw-data:/home/openclaw/.openclaw/agents/research/data
      # Persistent: OpenClaw state (gateway config, agent registrations, cron, pairing, sessions)
      - crypto-claw-state:/home/openclaw/.openclaw/.openclaw
      # Persistent: research agent state (auth, sessions)
      - crypto-claw-research-agent:/home/openclaw/.openclaw/agents/research/agent

    # Gateway accessible via Caddy HTTPS reverse proxy (no direct port exposure)
    expose:
      - '${OPENCLAW_GATEWAY_PORT:-18789}'

    environment:
      # Required: Anthropic API key
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Ollama Cloud (direct API — no sidecar)
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}

      # OpenAI (fallback — per-token billing if Codex OAuth not configured)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # Fund identity — determines which SQLite database to use
      - SAFE_ID=${SAFE_ID:-default}

      # Paper mode — simulate trades without real execution
      - PAPER_MODE=${PAPER_MODE:-false}
      - PAPER_STARTING_BALANCE=${PAPER_STARTING_BALANCE:-10000}
      - PAPER_STARTING_BALANCE_BASE=${PAPER_STARTING_BALANCE_BASE:-}
      - PAPER_STARTING_BALANCE_SOLANA=${PAPER_STARTING_BALANCE_SOLANA:-}
      - PAPER_STARTING_BALANCE_ETHEREUM=${PAPER_STARTING_BALANCE_ETHEREUM:-}
      - AUTO_APPROVE_BUY=${AUTO_APPROVE_BUY:-false}
      - ACTIVE_CHAINS=${ACTIVE_CHAINS:-base,ethereum,solana}
      - DEBANK_API_KEY=${DEBANK_API_KEY:-}

      # Optional: API keys for data scripts
      - GOPLUS_API_KEY=${GOPLUS_API_KEY:-}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - BASESCAN_API_KEY=${BASESCAN_API_KEY:-}
      - ARBISCAN_API_KEY=${ARBISCAN_API_KEY:-}
      - OPTIMISM_API_KEY=${OPTIMISM_API_KEY:-}
      - BIRDEYE_API_KEY=${BIRDEYE_API_KEY:-}
      - ZERION_API_KEY=${ZERION_API_KEY:-}
      - SOLSCAN_API_KEY=${SOLSCAN_API_KEY:-}
      - HELIUS_API_KEY=${HELIUS_API_KEY:-}

      # Channels (Telegram — opt-in for human chat with agents)
      - ENABLE_CHANNELS=${ENABLE_CHANNELS:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}

      # Telegram security — restrict who can interact with agents
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID:-}

      # Telegram supergroup forum topics (optional — enables per-topic agent routing)
      - TG_TOPIC_RESEARCH=${TG_TOPIC_RESEARCH:-}
      - TG_TOPIC_SENTINEL=${TG_TOPIC_SENTINEL:-}
      - TG_TOPIC_EXECUTOR=${TG_TOPIC_EXECUTOR:-}
      - TG_TOPIC_ALERTS=${TG_TOPIC_ALERTS:-}
      - TG_TOPIC_SYSTEM=${TG_TOPIC_SYSTEM:-}
      - TG_TOPIC_OBSERVER=${TG_TOPIC_OBSERVER:-}
      - TG_TOPIC_PORTFOLIO=${TG_TOPIC_PORTFOLIO:-}
      - PORTFOLIO_REPORT_HOUR=${PORTFOLIO_REPORT_HOUR:-0}

      # Telegram approval bot — inline Approve/Reject buttons for buy orders
      # Create a separate bot via @BotFather, add it to your supergroup
      - TELEGRAM_APPROVAL_BOT_TOKEN=${TELEGRAM_APPROVAL_BOT_TOKEN:-}

      # 1inch Swap API (Executor Agent — EVM swaps)
      - ONEINCH_API_KEY=${ONEINCH_API_KEY:-}

      # Safe wallet (Executor Agent — EVM)
      - SAFE_ADDRESS_ETH=${SAFE_ADDRESS_ETH:-}
      - SAFE_ADDRESS_BASE=${SAFE_ADDRESS_BASE:-}
      - SAFE_SIGNER_KEY=${SAFE_SIGNER_KEY:-}
      - RPC_ETH=${RPC_ETH:-}
      - RPC_BASE=${RPC_BASE:-}
      - RPC_SOL=${RPC_SOL:-}

      # Squads multisig (Executor Agent — Solana)
      - SQUADS_VAULT_ADDRESS=${SQUADS_VAULT_ADDRESS:-}
      - SQUADS_MULTISIG_ADDRESS=${SQUADS_MULTISIG_ADDRESS:-}
      - SQUADS_SIGNER_KEY=${SQUADS_SIGNER_KEY:-}

      # Agent memory backup (optional — git remote for pushing memory)
      - MEMORY_GIT_REMOTE=${MEMORY_GIT_REMOTE:-}

      # Observer agent — GitHub integration (private repo for issue tracking)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OBSERVER_ISSUES_REPO=${OBSERVER_ISSUES_REPO:-}

      # OpenClaw config
      - OPENCLAW_HOME=/home/openclaw/.openclaw
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND:-lan}
      - RESEARCH_MODEL=${RESEARCH_MODEL:-openai-codex/gpt-5.4}
      - SENTINEL_MODEL=${SENTINEL_MODEL:-openai-codex/gpt-5.4}
      - EXECUTOR_MODEL=${EXECUTOR_MODEL:-openai-codex/gpt-5.4}
      - OBSERVER_MODEL=${OBSERVER_MODEL:-openai-codex/gpt-5.4}

      # Agent resilience (entrypoint.sh fallback/emergency)
      - SENTINEL_MODEL_FALLBACK=${SENTINEL_MODEL_FALLBACK:-claude-haiku-4-5-20251001}
      - EXECUTOR_MODEL_FALLBACK=${EXECUTOR_MODEL_FALLBACK:-claude-haiku-4-5-20251001}
      - EMERGENCY_AFTER=${EMERGENCY_AFTER:-3}

      # App variables
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=6144
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPENCLAW_LOG_STYLE=${OPENCLAW_LOG_STYLE:-pretty}

    networks:
      - crypto-claw-net

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

  # HTTPS reverse proxy (self-signed TLS for secure context)
  caddy:
    image: caddy:latest
    container_name: crypto-claw-caddy
    restart: unless-stopped
    ports:
      - '${CADDY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}'
    environment:
      - SERVER_IP=${SERVER_IP:?Set SERVER_IP in .env}
      - CADDY_HTTPS_PORT=${CADDY_HTTPS_PORT:-443}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-certs:/certs
    entrypoint: sh -c 'if [ ! -f /certs/server.key ]; then apk add --no-cache openssl && openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -days 3650 -nodes -keyout /certs/server.key -out /certs/server.crt -subj "/CN=$SERVER_IP" -addext "subjectAltName=IP:$SERVER_IP"; fi && caddy run --config /etc/caddy/Caddyfile'
    networks:
      - crypto-claw-net
    depends_on:
      - crypto-claw

volumes:
  # Research workspace: MEMORY.md, daily logs, skills, scripts (back up with git)
  crypto-claw-memory:
    driver: local
  # Wallet data: SQLite databases (back up with sqlite3 .backup or file copy)
  crypto-claw-data:
    driver: local
  # OpenClaw state: gateway config, agent registrations, cron jobs, pairing, sessions
  crypto-claw-state:
    driver: local
  # Research agent state: auth profiles, session store
  crypto-claw-research-agent:
    driver: local
  # Caddy TLS certificates (self-signed, persistent across restarts)
  caddy-certs:
    driver: local

networks:
  crypto-claw-net:
    driver: bridge
